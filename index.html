
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estrategias Económicas</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #251c0c;
      --paper:    #fdfaf4;
      --border:   #d6cebb;
      --ink:      #add86c;
      --muted:    #7a7060;
      --accent:   #2a6f48;
      --accent2:  #b85c2a;
      --tag-bg:   #e8f0eb;
      --tag-text: #004e22;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 56px 20px 80px;
    }

    /* Grain texture overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 999;
    }

    .wrap { max-width: 680px; margin: 0 auto; }

    /* Header */
    header { margin-bottom: 44px; }
    header .eyebrow {
      font-size: 0.7rem; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--accent); font-weight: 500; margin-bottom: 10px;
    }
    header h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.15; color: var(--ink);
    }
    header h1 em { color: var(--accent); font-style: italic; }
    header p {
      margin-top: 12px; color: var(--muted);
      font-size: 0.88rem; max-width: 420px; line-height: 1.6;
    }
        header dd {
      font-family: 'Libre Baskerville', serif;
      margin-top: 12px; color: var(--ink); font-style: italic; 
      font-size: 0.88rem; max-width: 420px; line-height: 0.6;
    }

    /* Search bar */
    .search-wrap {
      position: relative; margin-bottom: 36px;
    }
    .search-wrap svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #search-input {
      width: 100%;
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem; color: var(--ink);
      padding: 14px 16px 14px 46px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(42,96,65,0.12);
    }
    #search-input::placeholder { color: var(--muted); }

    /* Results meta */
    #results-meta {
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 18px; letter-spacing: 0.3px;
    }

    /* Cards */
    #results { display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 28px 30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
      margin-bottom: 12px;
    }

    .card h2 {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.15rem; color: var(--ink); font-weight: 700;
    }

    .tag {
      background: var(--tag-bg); color: var(--tag-text);
      border-radius: 20px; font-size: 0.7rem;
      font-weight: 500; padding: 4px 12px;
      white-space: nowrap; letter-spacing: 0.4px;
    }

    .card p {
      font-size: 0.9rem; color: var(--muted);
      line-height: 1.7; margin-bottom: 20px;
    }

    .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .list-block h3 {
      font-size: 0.68rem; letter-spacing: 1.8px; text-transform: uppercase;
      font-weight: 500; margin-bottom: 10px;
    }
    .list-block.pros h3 { color: var(--accent); }
    .list-block.contras h3 { color: var(--accent2); }

    .list-block ul { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .list-block ul li {
      font-size: 0.83rem; color: var(--ink); line-height: 1.5;
      padding-left: 16px; position: relative;
    }
    .list-block ul li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 6px; height: 6px; border-radius: 50%;
    }
    .pros ul li::before { background: var(--accent); }
    .contras ul li::before { background: var(--accent2); }

    /* Empty / no results */
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 0.9rem;
    }
    .empty strong {
      display: block; font-family: 'Libre Baskerville', serif;
      font-size: 1.1rem; color: var(--ink); margin-bottom: 8px;
    }

    /* Divider line */
    .divider {
      border: none; border-top: 1.5px solid var(--border);
      margin: 24px 0;
    }

    @media (max-width: 480px) {
      .lists { grid-template-columns: 1fr; }
      .card { padding: 22px 20px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Economia para jovenes</p>
    <dd class="eyebrow">Por Dana, Diego y Ernesto</dd>
    <h1>Proyecto <em>Juvinance</em><br>al alcance de todos</h1>
    <p>Busca por nombre, categoría o palabra clave para explorar las estrategias disponibles.</p>
  </header>

  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search-input" placeholder="Busca una estrategia… ej. ahorro, inversión"/>
  </div>

  <p id="results-meta"></p>
  <div id="results"></div>

</div>

<script>
  const input   = document.getElementById('search-input');
  const results = document.getElementById('results');
  const meta    = document.getElementById('results-meta');
  let debounce;

  async function buscar(q) {
    const url = '/buscar' + (q ? '?q=' + encodeURIComponent(q) : '');
    const res  = await fetch(url);
    return await res.json();
  }

  function renderCard(e, i) {
    const prosHTML = e.pros.map(p => `<li>${p}</li>`).join('');
    const consHTML = e.contras.map(c => `<li>${c}</li>`).join('');
    return `
      <div class="card" style="animation-delay:${i * 0.06}s">
        <div class="card-top">
          <h2>${e.nombre}</h2>
          <span class="tag">${e.categoria}</span>
        </div>
        <p>${e.descripcion}</p>
        <hr class="divider"/>
        <div class="lists">
          <div class="list-block pros">
            <h3>✦ Ventajas</h3>
            <ul>${prosHTML}</ul>
          </div>
          <div class="list-block contras">
            <h3>✦ riesgos</h3>
            <ul>${consHTML}</ul>
          </div>
        </div>
      </div>`;
  }

  async function actualizar(q) {
    const data = await buscar(q);
    meta.textContent = q
      ? `${data.length} resultado${data.length !== 1 ? 's' : ''} para "${q}"`
      : `${data.length} estrategia${data.length !== 1 ? 's' : ''} disponible${data.length !== 1 ? 's' : ''}`;

    if (data.length === 0) {
      results.innerHTML = `<div class="empty"><strong>Sin resultados</strong>No se encontró ninguna estrategia para "${q}".</div>`;
    } else {
      results.innerHTML = data.map((e, i) => renderCard(e, i)).join('');
    }
  }

  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => actualizar(input.value.trim()), 250);
  });

  // Carga inicial
  actualizar('');
</script>
</body>
</html>
